build:
  enabled: false
codeql:
  timeout: 3600
crawl:
  base_url: http://localhost:8080/
  max_duration_sec: 600
  max_pages: 50
  zap_hybrid:
    client_max_duration_sec: 0
meta:
  cve: CVE-2022-3873
serve:
  web_root: src/main/webapp
  docker:
    context: docker/apps/drawio
    init_wait_sec: 10
    needs_mysql: false
  port: 8080
  type: docker
target:
  commit: v20.5.0
  framework: vanilla
  name: draw.io
  repo: https://github.com/jgraph/drawio.git
