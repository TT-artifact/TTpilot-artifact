build:
  enabled: false
codeql:
  timeout: 3600
crawl:
  base_url: http://localhost:8080/
  max_duration_sec: 600
  max_pages: 50
  zap_hybrid:
    client_max_duration_sec: 0
meta:
  cve: CVE-2025-54423
  uses_jquery: true
serve:
  docker:
    context: docker/apps/copyparty
    init_wait_sec: 10
    needs_mysql: false
  port: 8080
  type: docker
target:
  commit: v1.18.4
  framework: vanilla
  name: copyparty
  repo: https://github.com/9001/copyparty.git
