build:
  enabled: false
codeql:
  timeout: 3600
crawl:
  base_url: http://localhost:8080/
  max_duration_sec: 600
  max_pages: 50
  zap_hybrid:
    client_max_duration_sec: 0
meta:
  cve: CVE-2023-48094
serve:
  docker:
    context: docker/apps/cesium
    init_wait_sec: 10
    needs_mysql: false
  port: 8080
  type: docker
target:
  commit: '1.111'
  framework: vanilla
  name: cesiumjs
  repo: https://github.com/CesiumGS/cesium.git
