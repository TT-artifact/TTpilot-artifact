build:
  enabled: false
codeql:
  timeout: 3600
detect:
  # Third-party libraries and build output — not microweber's own app code.
  exclude_dirs: [libs, components, grunt]
crawl:
  base_url: http://localhost:8080/
  max_duration_sec: 600
  max_pages: 50
  zap_hybrid:
    client_max_duration_sec: 0
  auth:
    enabled: true
    type: form
    credentials:
      login_url: http://localhost:8080/admin/login
      username: admin
      password: admin123
meta:
  cve: CVE-2022-0698
  uses_jquery: true
serve:
  docker:
    context: docker/apps/microweber
    init_wait_sec: 30
    needs_mysql: true
  port: 8080
  type: docker
target:
  commit: v1.3.1
  framework: vanilla
  name: microweber
  repo: https://github.com/microweber/microweber.git
